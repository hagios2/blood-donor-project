name: Supabase keep-alive

on:
  schedule:
    # Every 3 days — well inside Supabase's 7-day free-tier inactivity window
    - cron: "17 6 */3 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -sf "https://utsfoobmgmhsrhxjsslr.supabase.co/rest/v1/profiles_public?select=id&limit=1" \
            -H "apikey: sb_publishable_oHQfGfW1MMJdGz2vnw2c8w_lTTn8s0F" \
            -o /dev/null
          echo "Pinged Supabase project to prevent free-tier auto-pause."
